spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartnotes
    username: root
    password: password
  jpa:
    hibernate:
      ddl-auto: update       # auto-creates tables from your entities
    show-sql: true           # prints SQL in console — useful while learning
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: smartnotes-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer  # ← keep this
      properties:
        "[spring.json.trusted.packages]": "*"
        "[spring.json.value.default.type]": "com.smartnotes.smartnotes_backend.kafka.NoteEvent"
server:
  port: 8080

# Add at the bottom of application.yml
ollama:
  base-url: http://localhost:11434
  model: gemma4

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers, threaddump, heapdump
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: smartnotes          # labels all metrics with app name
    distribution:
      percentiles-histogram:
        http.server.requests: true     # tracks p50, p95, p99 latency

  # ── Tracing (Zipkin) ──────────────────────────────────────
  tracing:
    sampling:
      probability: 1.0                 # trace 100% of requests (use 0.1 in prod)

  zipkin:
    base-url: http://localhost:9411

# ── P6Spy (SQL profiling) ─────────────────────────────────
  decorator:
    datasource:
      p6spy:
        enable-logging: true
        log-format: "%(currentTime) | %(executionTime)ms | %(sql)"

# ── Logging ───────────────────────────────────────────────
  logging:
    level:
      com.smartnotes: DEBUG              # your app — full debug logs
      org.springframework.security: INFO
      org.hibernate.SQL: DEBUG           # shows SQL (P6Spy also does this)
    pattern:
      console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
      name: logs/smartnotes.log          # writes logs to file for Loki